reward:
  progress: 10.0
  # 绕障允许短时横移/退让，其惩罚显著小于真实前进收益。
  regression: -1.0
  goal_reached: 30.0
  # 终止失败的代价必须显著高于数米进展奖励，避免后程硬冲。
  collision: -60.0
  unstable: -40.0
  stuck: -5.0
  timeout: -25.0
  out_of_bounds: -10.0
  observation_failure: -5.0

  heading: 0.05
  forward_to_goal: 0.25

  linear_action_rate: -0.01
  angular_action_rate: -0.01
  angular_speed: -0.1
  spin: -0.25

  time: -0.01
  path_length: 0.0
  action_limit_violation: -0.25
  unknown_risk: -0.02
  # 对高风险地形上的高速运动进行连续惩罚，为减速和绕行提供稠密信号。
  terrain_speed_risk: -0.75
termination:
  goal_tolerance_m: 0.35
  collision_height_range_m: 0.45
  unstable_risk_threshold: 0.15
  maximum_tilt_rad: 0.75
  fall_tilt_rad: 1.00
  stuck_timeout_s: 2.0
  maximum_episode_s: 40.0
  # 56 m地形块半边长28 m；15 m活动半径与12 m射程之和仍保留1 m裕量。
  maximum_distance_from_origin_m: 15.0
  maximum_bad_observation_steps: 3
