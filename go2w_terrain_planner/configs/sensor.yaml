sensor:
  # raycast使用16线首回波点云生成地图；analytic保留为快速消融基线。
  observation_source: raycast
  height_noise_std_m: 0.015
  range_noise_std_m: 0.010
  random_missing_probability: 0.03
  ray_only_probability: 0.02
  occlusion_sector_probability: 0.30
  occlusion_width_range_rad: [0.10, 0.50]
  pose_xy_noise_std_m: 0.015
  pose_yaw_noise_std_rad: 0.01
  time_jitter_std_s: 0.005
  lidar:
    channels: 16
    # 当前为可配置的16线近似角；获得XT16标定表后直接替换该数组。
    vertical_angles_deg: [-15.0, -13.0, -11.0, -9.0, -7.0, -5.0, -3.0, -1.0,
                          1.0, 3.0, 5.0, 7.0, 9.0, 11.0, 13.0, 15.0]
    horizontal_resolution_deg: 2.0
    minimum_range_m: 0.20
    maximum_range_m: 12.0
    ray_step_m: 0.08
    mount_height_m: 0.45
    scan_frequency_hz: 10.0
    motion_distortion: true
    ray_chunk_size: 256
