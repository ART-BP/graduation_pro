sensor:
  # Actor观测只来自Isaac Lab对静态三角网格执行的原生GPU射线求交。
  height_noise_std_m: 0.015
  range_noise_std_m: 0.010
  # 真实射线本身和已命中回波的丢失分开建模。
  beam_dropout_probability: 0.03
  return_dropout_probability: 0.02
  pose_xy_noise_std_m: 0.015
  pose_yaw_noise_std_rad: 0.01
  lidar:
    channels: 16
    # 每个槽对应一条独立射线；16线×每线2000个方位角=32000条射线。
    points_per_frame: 32000
    scan_frequency_hz: 10.0
    # XT16名义角表；有实机逐台标定文件时可直接替换，不只使用FOV端点。
    vertical_angles_deg: [-15.0, -13.0, -11.0, -9.0, -7.0, -5.0, -3.0, -1.0,
                          1.0, 3.0, 5.0, 7.0, 9.0, 11.0, 13.0, 15.0]
    horizontal_resolution_deg: 0.18
    minimum_range_m: 0.20
    # 局部点云只裁剪到12 m×12 m，12 m射程已覆盖裁剪区对角线并减少无效求交。
    maximum_range_m: 12.0
    mount_height_m: 0.55
    projection:
      # 与local_map_ws保持相同的12 m输入裁剪和0.05 m内部栅格语义。
      input_crop_length_x_m: 12.0
      input_crop_length_y_m: 12.0
      body_height_m: 0.35
      vertical_min_offset_m: -1.5
      vertical_max_offset_m: 1.5
      ground_percentile: 0.10
      span_lower_percentile: 0.05
      span_upper_percentile: 0.95
      # 至少两个真实回波才把地面/高度差作为有效测量，避免单点高度差恒为零。
      minimum_points_per_cell: 2
      # 1 mm量化远小于传感器噪声，同时避免无意义的0.1 mm排序精度。
      height_quantization_m: 0.001
      # 6 cm阈值可容纳噪声，但不会把5～10 cm小台阶普遍合并。
      maximum_ground_deviation_m: 0.06
      fusion_span_percentile: 0.75
