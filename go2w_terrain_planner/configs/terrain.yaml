terrain:
  enabled_types: [flat, ramp, step, stairs, rough, pit, wall, pillar, mixed, multi_route, low_obstacle]
  ramp_slope_range: [0.05, 0.40]
  step_height_range_m: [0.05, 0.35]
  step_width_range_m: [0.25, 0.60]
  rough_amplitude_range_m: [0.01, 0.12]
  pit_depth_range_m: [0.05, 0.40]
  # pit使用独立半宽；初次接触时从浅、窄坑开始，随前沿掌握度连续增难。
  pit_half_width_range_m: [0.25, 0.60]
  pit_curriculum_start_depth_max_m: 0.12
  pit_curriculum_start_half_width_max_m: 0.35
  # 深度达到该阈值后，奖励势能引导策略绕坑而不是继续直穿。
  pit_navigation_avoidance_depth_m: 0.18
  # 确保目标位于坑的远端之外，而不是落在坑边或危险区域内。
  pit_goal_clearance_m: 0.80
  obstacle_height_range_m: [0.55, 2.5]
  # 可直接越过的局部矮障碍，仅用于第四阶段的基础可通行性判断。
  low_obstacle_height_range_m: [0.06, 0.30]
  # 障碍带保留可绕行通道，并随机化绕行幅度。
  barrier_half_width_range_m: [0.40, 2.0]
  # 高于当前课程前沿的挑战样本先使用较窄障碍，再在正式前沿中恢复完整宽度。
  challenge_barrier_width_scale: 0.55
  # 障碍感知奖励绕行端点相对墙端的安全余量。
  barrier_navigation_clearance_m: 0.35
  friction_range: [0.35, 1.20]
curriculum:
  # 能力阶段与地形枚举彻底解耦，从基本趋近开始按九阶段单调解锁。
  initial_level: 1
  minimum_level: 1
  maximum_level: 9
  success_rate_up: 0.85
  success_rate_down: 0.20
  # 所有并行环境共享一个课程前沿；3200约等于原32环境各积累100回合。
  minimum_episodes_per_level: 3200
  full_difficulty_threshold: 0.90
  # 960约等于原32环境各验证30个完整难度回合。
  minimum_full_difficulty_episodes: 960
  # 全局统计按单回合更新，需要比原逐环境EMA更长的统计时间尺度。
  success_rate_smoothing: 0.005
  # 地形按最高已解锁前沿单调推进。低成功率通过回放恢复，不再自动降级。
  allow_level_demotion: false
  # 60%当前前沿、35%低阶段回放、5%未来一级预适应。
  frontier_sampling_probability: 0.60
  challenge_sampling_probability: 0.05
  challenge_level_span: 1
  # 每个阶段显式定义地形混合、目标距离、初始朝向跨度和域随机化强度。
  # heading_half_range_rad表示机器人初始航向相对目标方向的最大偏差。
  stages:
    1:
      name: flat_forward_short
      terrain_weights: {flat: 1.0}
      goal_distance_m: [1.0, 2.5]
      heading_half_range_rad: 0.15
      geometry_difficulty_range: [0.0, 0.0]
      domain_randomization_scale: 0.0
    2:
      name: flat_random_goal
      terrain_weights: {flat: 1.0}
      goal_distance_m: [1.5, 3.5]
      heading_half_range_rad: 3.141592653589793
      geometry_difficulty_range: [0.0, 0.0]
      domain_randomization_scale: 0.0
    3:
      name: gentle_slope_and_roughness
      terrain_weights: {ramp: 0.60, rough: 0.40}
      goal_distance_m: [1.5, 4.0]
      heading_half_range_rad: 3.141592653589793
      geometry_difficulty_range: [0.0, 0.45]
      domain_randomization_scale: 0.0
    4:
      name: small_discontinuities
      terrain_weights: {step: 0.45, pit: 0.30, low_obstacle: 0.25}
      goal_distance_m: [2.5, 5.0]
      heading_half_range_rad: 0.80
      geometry_difficulty_range: [0.0, 0.45]
      domain_randomization_scale: 0.0
    5:
      name: sparse_large_obstacles
      terrain_weights: {wall: 0.55, pillar: 0.45}
      goal_distance_m: [3.0, 6.0]
      heading_half_range_rad: 3.141592653589793
      geometry_difficulty_range: [0.0, 1.0]
      domain_randomization_scale: 0.0
    6:
      name: mixed_local_planning
      terrain_weights: {mixed: 0.60, ramp: 0.10, step: 0.10, wall: 0.10, pillar: 0.10}
      goal_distance_m: [3.0, 6.0]
      heading_half_range_rad: 3.141592653589793
      geometry_difficulty_range: [0.0, 0.75]
      domain_randomization_scale: 0.0
    7:
      name: stairs_bidirectional
      terrain_weights: {stairs: 1.0}
      goal_distance_m: [3.0, 6.0]
      heading_half_range_rad: 0.25
      geometry_difficulty_range: [0.0, 0.65]
      domain_randomization_scale: 0.0
    8:
      name: complex_long_range
      terrain_weights: {mixed: 0.35, multi_route: 0.35, wall: 0.10, pillar: 0.10, stairs: 0.10}
      goal_distance_m: [5.0, 8.0]
      heading_half_range_rad: 3.141592653589793
      geometry_difficulty_range: [0.35, 1.0]
      domain_randomization_scale: 0.0
    9:
      name: sim2real_randomized
      terrain_weights: {flat: 0.05, ramp: 0.10, step: 0.10, stairs: 0.10, rough: 0.10, pit: 0.10, wall: 0.10, pillar: 0.10, mixed: 0.10, multi_route: 0.10, low_obstacle: 0.05}
      goal_distance_m: [5.0, 10.0]
      heading_half_range_rad: 3.141592653589793
      geometry_difficulty_range: [0.35, 1.0]
      domain_randomization_scale: 1.0
