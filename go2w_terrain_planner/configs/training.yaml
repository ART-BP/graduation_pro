training:
  seed: 42
  device: cuda:0
  num_envs: 32
  maximum_iterations: 10000
  output_root: /workspace/data/runs
runner:
  # 32个环境时每次收集3072条样本，并覆盖更长的障碍交互轨迹。
  num_steps_per_env: 96
  save_interval: 200
  experiment_name: go2w_terrain_navigation
  run_name: phase13_raycast_reward_diversity
  clip_actions: null
ppo:
  value_loss_coef: 0.5
  use_clipped_value_loss: true
  clip_param: 0.1
  entropy_coef: 0.001
  num_learning_epochs: 3
  num_mini_batches: 8
  learning_rate: 5.0e-05
  # 启用RSL-RL的KL自适应学习率，使desired_kl实际参与更新控制。
  schedule: adaptive
  gamma: 0.997
  lam: 0.98
  desired_kl: 0.01
  max_grad_norm: 0.5
model:
  # 单张紧凑地图保留空间细节，GRU只编码低维运动与指令序列。
  architecture: compact_map_motion_gru_v7
  map_encoder_channels: [32, 64, 96, 128]
  map_pool_size: 8
  map_feature_dim: 384
  motion_gru_hidden_dim: 128
  auxiliary_hidden_dim: 128
  fusion_hidden_dim: 384
  initial_action_std: 0.4
  minimum_action_std: 0.08
  maximum_action_std: 0.6
  maximum_pre_tanh_mean: 1.5
  runtime_finite_checks: false
  critic_hidden_dims:
  - 256
  - 256
