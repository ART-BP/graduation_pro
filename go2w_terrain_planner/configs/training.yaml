training:
  seed: 42
  device: cuda:0
  num_envs: 32
  maximum_iterations: 10000
  output_root: /workspace/data/runs
runner:
  # 32个环境时每次收集1536条样本，降低大模型PPO梯度方差。
  num_steps_per_env: 48
  save_interval: 200
  experiment_name: go2w_terrain_navigation
  run_name: phase6_xt16_raycast_observation
  clip_actions: null
ppo:
  value_loss_coef: 0.5
  use_clipped_value_loss: true
  clip_param: 0.1
  entropy_coef: 0.001
  num_learning_epochs: 3
  num_mini_batches: 4
  learning_rate: 5.0e-05
  schedule: fixed
  gamma: 0.995
  lam: 0.95
  desired_kl: 0.01
  max_grad_norm: 0.5
model:
  map_encoder_channels: [24, 48, 96, 128]
  map_pool_size: 6
  map_feature_dim: 192
  temporal_hidden_dim: 192
  auxiliary_hidden_dim: 96
  fusion_hidden_dim: 256
  initial_action_std: 0.4
  minimum_action_std: 0.08
  maximum_action_std: 0.6
  maximum_pre_tanh_mean: 1.5
  runtime_finite_checks: false
  critic_hidden_dims:
  - 256
  - 256
