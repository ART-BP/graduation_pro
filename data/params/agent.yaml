seed: 42
device: cuda:0
num_steps_per_env: 96
max_iterations: 10000
empirical_normalization: null
obs_groups:
  policy:
  - policy
  critic:
  - critic
clip_actions: null
save_interval: 200
experiment_name: go2w_terrain_navigation
run_name: phase13_raycast_reward_diversity
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
policy:
  class_name: Go2wActorCritic
  init_noise_std: 0.4
  noise_std_type: scalar
  state_dependent_std: false
  actor_obs_normalization: false
  critic_obs_normalization: false
  actor_hidden_dims:
  - 128
  - 128
  critic_hidden_dims:
  - 256
  - 256
  activation: elu
  runtime_finite_checks: false
  map_channels: 7
  map_size: 200
  command_history_length: 8
  motion_history_length: 8
  architecture: compact_map_motion_gru_v7
  map_encoder_channels:
  - 32
  - 64
  - 96
  - 128
  map_pool_size: 8
  map_feature_dim: 384
  motion_gru_hidden_dim: 128
  auxiliary_hidden_dim: 128
  fusion_hidden_dim: 384
  minimum_action_std: 0.08
  maximum_action_std: 0.6
  maximum_pre_tanh_mean: 1.5
algorithm:
  class_name: PPO
  num_learning_epochs: 3
  num_mini_batches: 8
  learning_rate: 5.0e-05
  schedule: adaptive
  gamma: 0.997
  lam: 0.98
  entropy_coef: 0.001
  desired_kl: 0.01
  max_grad_norm: 0.5
  value_loss_coef: 0.5
  use_clipped_value_loss: true
  clip_param: 0.1
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg: null
